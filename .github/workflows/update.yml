name: Update profile card

on:
  schedule:
    # GitHub Actions' shortest supported interval is five minutes. Offset from
    # the hour to reduce the chance of schedule delays during busy periods.
    - cron: "3/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-profile]
  push:
    paths:
      - "generator/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: profile-card-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: AmanCiphers
        run: node generator/index.js
      - name: Commit updated card when needed
        run: |
          if git diff --quiet -- light_mode.svg dark_mode.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_mode.svg dark_mode.svg
          git commit -m "chore: update profile card"
          git push
